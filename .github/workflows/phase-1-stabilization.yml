name: Phase 1 Stabilization

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feature/phase-1-mvp-foundation]
  workflow_dispatch:

concurrency:
  group: phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stabilization-placeholder
      ANTHROPIC_API_KEY: stabilization-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        run: corepack prepare pnpm@9.15.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  migration-contract:
    name: Migration contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migration sequence
        shell: bash
        run: |
          set -euo pipefail
          expected=(012 013 014 015 016 017)
          for number in "${expected[@]}"; do
            count=$(find database/migrations -maxdepth 1 -type f -name "${number}_*.sql" | wc -l)
            test "$count" -eq 1 || { echo "Expected exactly one migration ${number}, found ${count}"; exit 1; }
          done

      - name: Verify required workflow functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            create_mvp_production
            create_brief_version
            decide_brief_version
            start_research_run
            complete_research_run
            fail_research_run
            decide_research_version
            start_script_run
            complete_script_run
            fail_script_run
            decide_script_version
            assemble_production_package
            decide_production_package_version
          )
          for function_name in "${functions[@]}"; do
            grep -Rqi "function public.${function_name}" database/migrations || {
              echo "Missing database function: ${function_name}"
              exit 1
            }
          done

      - name: Reject destructive migration statements
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '^[[:space:]]*(drop[[:space:]]+(table|schema)|truncate[[:space:]])' database/migrations/01{2,3,4,5,6,7}_*.sql; then
            echo "Destructive statement detected in Phase 1 migrations."
            exit 1
          fi
